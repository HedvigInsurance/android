name: CI bench

on:
  push:
    branches:
      - ci-bench/**

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.matrix.outputs.android }}
      umbrella: ${{ steps.matrix.outputs.umbrella }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: python3 scripts/ci-bench/matrix.py ${{ startsWith(github.ref_name, 'ci-bench/smoke') && 'smoke' || 'full' }} >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    name: ${{ matrix.config }} ${{ matrix.task }} r${{ matrix.rep }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Gradle properties
        run: ./scripts/ci-bench/props.sh ${{ matrix.props }}
      - name: Prebuild
        run: ./scripts/ci-prebuild.sh
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          LOKALISE_ID: ${{ secrets.LOKALISE_ID }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Bench
        run: ./scripts/ci-bench/run.sh "${{ matrix.gradle }}"
        env:
          BENCH_OUT: ${{ runner.temp }}/bench
          BENCH_CONFIG: ${{ matrix.config }}
          BENCH_RUNNER: ${{ matrix.runner }}
          BENCH_TASK: ${{ matrix.task }}
          BENCH_REP: ${{ matrix.rep }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.config }}-${{ matrix.task }}-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/bench/results.jsonl
            ${{ runner.temp }}/bench/*.mem
            ${{ runner.temp }}/bench/*.log
            ${{ runner.temp }}/bench/*.txt
          retention-days: 14

  umbrella:
    needs: plan
    name: ${{ matrix.config }} umbrella r${{ matrix.rep }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Free macOS runners are shared with the iOS team's CI, so keep the footprint small.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.umbrella) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Gradle properties
        run: ./scripts/ci-bench/props.sh ${{ matrix.props }}
      - name: Prebuild
        run: ./scripts/ci-prebuild.sh
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          LOKALISE_ID: ${{ secrets.LOKALISE_ID }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Bench
        run: ./scripts/ci-bench/run.sh ":umbrella:assembleHedvigSharedReleaseXCFramework"
        env:
          BENCH_OUT: ${{ runner.temp }}/bench
          BENCH_CONFIG: ${{ matrix.config }}
          BENCH_RUNNER: ${{ matrix.runner }}
          BENCH_TASK: umbrella
          BENCH_REP: ${{ matrix.rep }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.config }}-umbrella-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/bench/results.jsonl
            ${{ runner.temp }}/bench/*.mem
            ${{ runner.temp }}/bench/*.log
            ${{ runner.temp }}/bench/*.txt
          retention-days: 14
