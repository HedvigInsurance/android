name: iOS shared code

# Normal PRs run on Linux, which compiles the iOS source sets to klibs but cannot run them. This job runs what only
# macOS can: every module's tests on the iOS simulator, the release device framework link, and the check that the
# framework stays within its size budget. It runs as a required step of the umbrella release on weeknights and on its
# own schedule at weekends, so once a day. GitHub emails a failed scheduled run to whoever last changed its schedule.
on:
  schedule:
    - cron: '0 3 * * 0,6'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ios_shared:
    name: iOS simulator tests and framework link
    runs-on: macos-26-xlarge
    env:
      # The release iosArm64 framework's shipped bytes (__TEXT plus non-zerofill __DATA) may not exceed this.
      MAX_SHIPPED_BYTES: 20000000
    steps:
      - uses: actions/checkout@v7
      - name: Setup CI
        uses: ./.github/actions/common-setup
        with:
          gradle-cache-read-only: 'false'
          download-schema: 'false'
          download-strings: 'false'
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          lokalise-id: ${{ secrets.LOKALISE_ID }}
          lokalise-token: ${{ secrets.LOKALISE_TOKEN }}
      - name: Tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test checkUmbrellaClasspath
      - name: Link the release device framework
        run: ./gradlew :umbrella:linkReleaseFrameworkIosArm64
      - name: Check the device framework size
        run: |
          BIN=app/umbrella/build/bin/iosArm64/releaseFramework/HedvigShared.framework/HedvigShared
          SHIPPED=$(size -m "$BIN" | grep -E 'Section \(__(TEXT|DATA), ' | grep -v zerofill | sed -E 's/.*: ([0-9]+).*/\1/' | paste -sd+ - | bc)
          echo "Shipped bytes (__TEXT + non-zerofill __DATA): $SHIPPED, budget $MAX_SHIPPED_BYTES"
          if [ "$SHIPPED" -gt "$MAX_SHIPPED_BYTES" ]; then
            echo "The device framework is over its size budget"
            exit 1
          fi
