name: Build and Publish to Play Store
on:
  push:
    branches:
      - release/**
      - hotfix/**

concurrency:
  group: ref-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    runs-on: ubuntu-latest-8-vcpu
    steps:
      - uses: actions/checkout@v7
      # scripts/release.sh pushes release/X.Y.Z together with tag X.Y.Z on its master
      # merge. A missing or misplaced tag means the release was cut by hand and master
      # or develop are probably missing their merges, so stop before uploading.
      - name: Require the release tag
        if: startsWith(github.ref_name, 'release/')
        run: |
          version="${GITHUB_REF_NAME#release/}"
          if ! git fetch --quiet --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
            echo "::error::Tag $version is not on origin. Cut releases with scripts/release.sh, which pushes release/$version, its tag and the master and develop merges together."
            exit 1
          fi
          if ! git cat-file -p "$version^{commit}" | grep -qx "parent $GITHUB_SHA"; then
            echo "::error::Tag $version is not the master merge of release/$version ($GITHUB_SHA). Cut releases with scripts/release.sh."
            exit 1
          fi
      - name: Setup CI
        uses: ./.github/actions/common-setup
        with:
          gradle-cache-read-only: 'false'
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          lokalise-id: ${{ secrets.LOKALISE_ID }}
          lokalise-token: ${{ secrets.LOKALISE_TOKEN }}
      - run: echo VERSION_CODE=$(date +%s) >> $GITHUB_ENV
      - uses: chkfung/android-version-actions@v1.2
        with:
          gradlePath: app/app/build.gradle.kts
          versionCode: ${{ env.VERSION_CODE }}
      - name: Run license release report
        run: ./gradlew licenseReleaseReport --no-configuration-cache --continue
        continue-on-error: true
      - name: Build
        run: "./gradlew :app:bundleRelease"
      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION
      - uses: r0adkll/sign-android-release@v1
        name: Sign app AAB
        id: sign_app
        with:
          releaseDirectory: app/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
      - name: Deploy to Play Store Internal-track
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hedvig.app
          track: internal
          mappingFile: app/app/build/outputs/mapping/release/mapping.txt
          status: completed
      - name: Upload mapping files to datadog
        run: "./gradlew uploadMappingRelease --no-configuration-cache"
