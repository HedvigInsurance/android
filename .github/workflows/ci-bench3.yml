name: CI bench (warm cache, two bases)

on:
  push:
    branches:
      - ci-bench3/**

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      umbrella: ${{ steps.matrix.outputs.umbrella }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: python3 scripts/ci-bench/matrix3.py ${{ contains(github.ref_name, 'smoke') && 'smoke' || 'full' }} >> "$GITHUB_OUTPUT"

  # Plays the part of a develop workflow: builds everything once and writes the Gradle User Home
  # cache that every PR-shaped job below restores.
  seed:
    runs-on: ubuntu-latest-8-vcpu
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - run: ./scripts/ci-bench/props.sh uncapped
      - run: ./scripts/ci-prebuild.sh
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          LOKALISE_ID: ${{ secrets.LOKALISE_ID }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - run: ./gradlew test jvmTest lint ktlintCheck :app:bundleDebug --continue

  pr:
    needs: [plan, seed]
    name: ${{ matrix.config }} ${{ matrix.task }} ${{ matrix.scenario }} r${{ matrix.rep }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - run: ./scripts/ci-bench/props.sh ${{ matrix.props }}
      - run: ./scripts/ci-prebuild.sh
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          LOKALISE_ID: ${{ secrets.LOKALISE_ID }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Bench
        run: ./scripts/ci-bench/run2.sh ${{ matrix.scenario }} "${{ matrix.gradle }}"
        env:
          BENCH_OUT: ${{ runner.temp }}/bench
          BENCH_CONFIG: ${{ matrix.config }}
          BENCH_TASK: ${{ matrix.task }}
          BENCH_REP: ${{ matrix.rep }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench3-${{ matrix.config }}-${{ matrix.task }}-${{ matrix.scenario }}-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/bench/result.json
            ${{ runner.temp }}/bench/build.log
          retention-days: 14

  umbrella-seed:
    runs-on: macos-26-xlarge
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - run: ./scripts/ci-bench/props.sh current
      - run: ./scripts/ci-prebuild.sh
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          LOKALISE_ID: ${{ secrets.LOKALISE_ID }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - run: ./gradlew :umbrella:assembleHedvigSharedReleaseXCFramework

  umbrella:
    needs: [plan, umbrella-seed]
    name: ${{ matrix.config }} umbrella ${{ matrix.scenario }} r${{ matrix.rep }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.umbrella) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'zulu'
      - run: ./scripts/ci-bench/props.sh ${{ matrix.props }}
      - run: ./scripts/ci-prebuild.sh
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          LOKALISE_ID: ${{ secrets.LOKALISE_ID }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Bench
        run: ./scripts/ci-bench/run2.sh ${{ matrix.scenario }} "${{ matrix.gradle }}"
        env:
          BENCH_OUT: ${{ runner.temp }}/bench
          BENCH_CONFIG: ${{ matrix.config }}
          BENCH_TASK: ${{ matrix.task }}
          BENCH_REP: ${{ matrix.rep }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench3-${{ matrix.config }}-umbrella-${{ matrix.scenario }}-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/bench/result.json
            ${{ runner.temp }}/bench/build.log
          retention-days: 14
