query CoInsured {
  currentMember {
    firstName
    lastName
    ssn
    activeContracts {
      id
      exposureDisplayName
      currentAgreement {
        productVariant {
          displayName
          typeOfContract
        }
      }
      coInsured {
        ...CoInsuredFragment
      }
      coOwners {
        ...CoOwnerFragment
      }
    }
  }
}

fragment CoInsuredFragment on ContractCoInsured {
  firstName
  lastName
  ssn
  birthdate
  hasMissingInfo
  activatesOn
  terminatesOn
}

fragment CoOwnerFragment on ContractCoOwner {
  firstName
  lastName
  ssn
  birthdate
  hasMissingInfo
  activatesOn
  terminatesOn
}
