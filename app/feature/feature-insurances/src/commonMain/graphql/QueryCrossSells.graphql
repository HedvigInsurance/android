query CrossSells($experiments: [CrossSellExperimentInput!]!) {
  currentMember {
    id
    crossSellV2(input: { userFlow: INSURANCES, flowSource: null, experiments: $experiments }) {
      otherCrossSells {
        id
        title
        description
        buttonTitle
        storeUrl
        pillowImageSmall {
          src
          id
          alt
        }
        pillowImageLarge {
          src
          id
          alt
        }
      }
    }
  }
}
