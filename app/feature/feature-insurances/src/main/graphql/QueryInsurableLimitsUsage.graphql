query InsurableLimitsUsage($contractId: UUID!) {
  contract(id: $contractId) {
    insurableLimitsUsage {
      periodStartDate
      periodEndDate
      total {
        ...InsurableLimitUsageFragment
      }
      medicine {
        ...InsurableLimitUsageFragment
      }
      deductible {
        ...InsurableLimitUsageFragment
      }
    }
  }
}

fragment InsurableLimitUsageFragment on InsurableLimitUsage {
  used {
    ...MoneyFragment
  }
  limit {
    ...MoneyFragment
  }
  remaining {
    ...MoneyFragment
  }
}
