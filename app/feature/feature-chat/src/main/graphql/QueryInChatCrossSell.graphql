query InChatCrossSell($input: CrossSellInput!) {
  currentMember {
    activeContracts {
      currentAgreement {
        productVariant {
          typeOfContract
        }
      }
    }
    crossSellV2(input: $input) {
      recommendedCrossSell {
        crossSell {
          id
          storeUrl
        }
        discountPercent
      }
    }
  }
}
