query InChatCrossSell($input: CrossSellInput!) {
  currentMember {
    crossSellV2(input: $input) {
      recommendedCrossSell {
        crossSell {
          id
          title
          description
          buttonTitle
          storeUrl
        }
      }
    }
  }
}

query InChatCrossSellEligibility($conversationId: UUID!) {
  conversation(id: $conversationId) {
    id
    showCrossSales
  }
}
