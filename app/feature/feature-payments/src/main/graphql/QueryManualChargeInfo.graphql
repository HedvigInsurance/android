query ManualChargeInfo {
  currentMember {
    missedChargeIdToChargeManually
    pastCharges {
      ...on MemberCharge {
        id
        date
        status
        net {
          ...MoneyFragment
        }
      }
    }
    paymentMethods(version: 2) {
      payinMethods {
        ...MemberPaymentMethodFragment
      }
    }
    activeContracts {
      terminationDueToMissedPayments
      terminationDate
    }
  }
}
