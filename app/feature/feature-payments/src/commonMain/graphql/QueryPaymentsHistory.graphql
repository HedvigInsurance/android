query PaymentHistoryWithDetails {
  currentMember {
    pastCharges {
      ...MemberChargeFragment
    }
    futureCharge {
      ...MemberChargeFragment
    }
    ongoingCharges {
      ...MemberChargeFragment
    }
    referralInformation {
      code
    }
    paymentMethods(version: 2) {
      payinMethods {
        ...MemberPaymentMethodFragment
      }
    }
  }
}
