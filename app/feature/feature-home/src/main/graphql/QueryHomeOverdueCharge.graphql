query HomeOverdueCharge {
  currentMember {
    missedChargeIdToChargeManually
    pastCharges {
      id
      net {
        ...MoneyFragment
      }
    }
    futureCharge {
      id
      status
      chargeBreakdown {
        periods {
          isPreviouslyFailedCharge
        }
      }
    }
  }
}
