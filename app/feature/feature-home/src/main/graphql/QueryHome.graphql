query Home($claimsHistoryFlag: Boolean!, $resumeClaimEnabled: Boolean!, $disableShopSessions: Boolean!) {
  currentMember {
    firstName
    resumableClaimIntent @include(if: $resumeClaimEnabled) {
      id
      displayName
      createdAt
    }
    claims@skip(if: $claimsHistoryFlag) {
      ...ClaimFragment
    }
    claimsActive@include(if: $claimsHistoryFlag) {
      ...ClaimFragment
    }
    partnerClaimsActive {
      ...PartnerClaimFragment
    }
    terminatedContracts {
      id
      currentAgreement {
        productVariant {
          typeOfContract
        }
      }
    }
    pendingContracts {
      id
      externalInsuranceCancellationHandledByHedvig
      exposureDisplayName

        productVariant {
          typeOfContract
        }

    }
    importantMessages {
      id
      message
      linkInfo {
        url
        buttonText
      }
    }
    crossSellV2(input: { userFlow: HOME_X_SELL, flowSource: null, experiments: [] }) {
      discountAvailable
      recommendedCrossSell {
        crossSell {
          ...HomeCrossSellFragment
        }
        bannerText
        discountText
        buttonText
        buttonDescription
        numberOfEligibleContracts
        discountPercent
        backgroundPillowImages {
          leftImage {
            src
          }
          rightImage {
            src
          }
        }
      }
      otherCrossSells {
        ...HomeCrossSellFragment
      }
      recommendedAddon {
        id
        title
        description
        buttonText
        deepLink
        bannerText
        benefits
        pillowImageLarge {
          src
        }
        pillowImageSmall {
          src
        }
      }
    }
    ongoingShopSessions @skip(if: $disableShopSessions) {
      id
      display {
        title
        subtitle
        monthlyNet {
          amount
          currencyCode
        }
        resumeUrl
        pillowImage {
          src
        }
      }
    }
    memberActions {
      firstVetAction {
        sections {
          title
          buttonTitle
          description
          url
        }
      }
    }
    activeContracts {
      id
      masterInceptionDate
      currentAgreement {
        productVariant {
          typeOfContract
        }
      }
    }
  }
}

fragment HomeCrossSellFragment on CrossSell {
  id
  title
  description
  buttonTitle
  storeUrl
  pillowImageLarge {
    src
    id
    alt
  }
}
