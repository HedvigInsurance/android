query ContractWithdrawal($contractId: UUID!) {
  currentMember {
    id
    contractWithdrawal(contractId: $contractId) {
      statusText
      action {
        ... on TerminationFlowActionTerminateWithDate {
          minDate
          maxDate
          extraCoverage {
            displayName
            displayValue
          }
        }
        ... on TerminationFlowActionDeleteInsurance {
          extraCoverage {
            displayName
            displayValue
          }
        }
      }
    }
  }
}
