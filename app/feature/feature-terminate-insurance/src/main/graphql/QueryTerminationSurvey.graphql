query TerminationSurvey($contractId: UUID!, $redirectionEnabled: Boolean!) {
  terminationSurvey(contractId: $contractId, redirectionEnabled: $redirectionEnabled) {
    options {
      id
      title
      feedbackRequired
      redirection {
        title
        description
        type
        actionText
        image {
          url
          overlayText
        }
      }
      subOptions {
        id
        title
        feedbackRequired
        subOptions {
          id
          title
          feedbackRequired
          subOptions {
            id
            title
            feedbackRequired
            suggestion {
              ...TerminationSurveyOptionSuggestionFragment
            }
          }
          suggestion {
            ...TerminationSurveyOptionSuggestionFragment
          }
        }
        suggestion {
          ...TerminationSurveyOptionSuggestionFragment
        }
      }
      suggestion {
        ...TerminationSurveyOptionSuggestionFragment
      }
    }
    action {
      ... on TerminationFlowActionTerminateWithDate {
        minDate
        maxDate
        extraCoverage {
          displayName
          displayValue
        }
      }
      ... on TerminationFlowActionDeleteInsurance {
        extraCoverage {
          displayName
          displayValue
        }
      }
    }
  }
}

fragment TerminationSurveyOptionSuggestionFragment on TerminationFlowSurveyOptionSuggestion {
  type
  description
  actionText
  url
}
