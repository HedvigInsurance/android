# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Ensure important default jvmargs aren't overwritten. See https://github.com/gradle/gradle/issues/19750
org.gradle.jvmargs=-Xmx8g -Xms8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MetaspaceSize=1g -XX:ReservedCodeCacheSize=512m

# Kotlin compilation runs in its own daemon JVM; the org.gradle.jvmargs above do not apply to it.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# https://docs.gradle.org/8.11/release-notes.html#config-cache
org.gradle.configuration-cache.parallel=true

# Enable caching between builds.
org.gradle.caching=true

# Enable configuration caching between builds.
org.gradle.configuration-cache=true

# Metro generates top-level @Provides for each @ContributesBinding/@Inject impl (instead of @Binds shorthands),
# so contributed impls and their helper interfaces can stay `internal` and still merge into the :app graph.
# Without this, an internal contributed class is silently dropped and only fails at the full-graph compile.
metro.generateContributionProviders=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.dependency.useConstraints=true
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

kotlin.native.binary.forceNativeThreadStateForFunctions=org_jetbrains_skia_DirectContext__1nFlushAndSubmit;org_jetbrains_skia_Canvas__1nDrawPicture
